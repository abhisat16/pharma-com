<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharma.com</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap">
<style>
/* Layout: the chemist's counter. Left, a deep-green voice station (mic, waveform, transcript). Right, the thermal bill slip it fills. Tabs: stock, bills, today. */
:root{
  --paper:#EEF2EF; --surface:#FFFFFF; --sunk:#F4F7F5; --ink:#0F1F1A; --muted:#5E7068; --line:#D7E0DB;
  --brand:#0B6A55; --brand-2:#0D8269; --brand-ink:#FFFFFF; --brand-soft:#DCEDE6;
  --station:#0A4A3C; --station-2:#0E5A49; --station-ink:#F2FBF7; --station-muted:#9CC9B9;
  --signal:#F0613A; --signal-soft:#FBE3DB;
  --slip:#FFFEF8; --slip-ink:#1C1C1A; --slip-muted:#75736B; --slip-rule:#D2CFC3;
  --ok:#1B7A47; --ok-soft:#DDF1E4; --warn:#94600A; --warn-soft:#FAEED6; --bad:#B42318; --bad-soft:#FCE5E1; --rx:#5A3EA6; --rx-soft:#ECE6FA;
  --display:"Bricolage Grotesque","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Devanagari","Noto Sans Kannada","Noto Sans Telugu",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --lvl:0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1411; --surface:#121E1A; --sunk:#0F1916; --ink:#E2ECE8; --muted:#93A79F; --line:#22322D;
  --brand:#2FB58F; --brand-2:#4CC7A3; --brand-ink:#04231A; --brand-soft:#15322A;
  --station:#0E3A30; --station-2:#134A3D; --station-ink:#EAF7F1; --station-muted:#8DBFAD;
  --signal:#FF7A52; --signal-soft:#3A1D14;
  --slip:#F3F0E5; --slip-ink:#1C1C1A; --slip-muted:#64625B; --slip-rule:#C3BFB2;
  --ok:#5ECF8D; --ok-soft:#163224; --warn:#F0B354; --warn-soft:#342812; --bad:#FF8A7D; --bad-soft:#3A1915; --rx:#B9A3FF; --rx-soft:#2A2340;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1411; --surface:#121E1A; --sunk:#0F1916; --ink:#E2ECE8; --muted:#93A79F; --line:#22322D;
  --brand:#2FB58F; --brand-2:#4CC7A3; --brand-ink:#04231A; --brand-soft:#15322A;
  --station:#0E3A30; --station-2:#134A3D; --station-ink:#EAF7F1; --station-muted:#8DBFAD;
  --signal:#FF7A52; --signal-soft:#3A1D14;
  --slip:#F3F0E5; --slip-ink:#1C1C1A; --slip-muted:#64625B; --slip-rule:#C3BFB2;
  --ok:#5ECF8D; --ok-soft:#163224; --warn:#F0B354; --warn-soft:#342812; --bad:#FF8A7D; --bad-soft:#3A1915; --rx:#B9A3FF; --rx-soft:#2A2340;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);min-height:100%;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px;border-radius:8px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:28px;font-weight:700}
h2{font-size:16px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row-between{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;flex:none;stroke:none}
.mark *{stroke:none}
.mark circle{stroke:var(--surface);stroke-width:2}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.brand-t span{font-size:12px;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:4px;margin-inline:auto}
.nav a{position:relative;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 14px;border-radius:10px}
.nav a svg{width:18px;height:18px}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.nav a i{position:absolute;top:6px;left:24px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:1.5px solid var(--surface)}
.bar-r{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:var(--ok)} .pill.warn::before{background:var(--warn)} .pill.bad::before{background:var(--bad)}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon svg{width:18px;height:18px}
@media (max-width:820px){
  .bar{flex-wrap:wrap}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .nav a{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 10px;flex:1}
  .nav a i{left:auto;right:calc(50% - 16px)}
  .bar-r{margin-left:auto}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .pill span{max-width:120px;overflow:hidden;text-overflow:ellipsis}
}

main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:16px}

/* ---------- counter ---------- */
.counter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:24px;align-items:start}
@media (max-width:900px){.counter{grid-template-columns:minmax(0,1fr)}}
.voice-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.station{position:relative;background:radial-gradient(120% 90% at 50% 0%,var(--station-2),var(--station) 70%);color:var(--station-ink);border-radius:24px;padding:18px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:400px;overflow:hidden}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px}
.langs button{border:0;background:transparent;color:var(--station-muted);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer}
.langs button:hover{color:var(--station-ink)}
.langs button[aria-pressed="true"]{background:var(--station-ink);color:var(--station)}
#mic{position:relative;margin-top:26px;width:132px;height:132px;border-radius:50%;border:0;background:var(--station-ink);color:var(--station);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 12px rgba(255,255,255,.06),0 0 0 26px rgba(255,255,255,.03);transition:background .15s,transform .15s}
#mic:hover{transform:scale(1.03)}
#mic:active{transform:scale(.97)}
#mic svg{width:50px;height:50px;position:relative}
#mic .ring{position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--signal);opacity:0;transform:scale(calc(.94 + var(--lvl)*.45));transition:transform .07s linear}
body.listening #mic{background:var(--signal);color:#fff}
body.listening #mic .ring{opacity:.7}
body.busy #mic{opacity:.6;pointer-events:none}
.wave{display:flex;align-items:center;gap:4px;height:34px}
.wave i{display:block;width:4px;height:4px;border-radius:2px;background:var(--station-muted);opacity:.55;transition:height .08s linear}
body.listening .wave i{background:var(--station-ink);opacity:.95}
.mic-state{margin:0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.live{width:100%;max-width:560px;text-align:center;font-size:20px;line-height:1.45;overflow-wrap:anywhere;min-height:30px}
.live .src{display:inline-block;margin-top:6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--station-muted);font-weight:700}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);font-size:15px}
.type button{width:48px;border:0;border-radius:14px;background:var(--ink);color:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.type button svg{width:20px;height:20px;stroke-width:2.2}
.demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;font-weight:600}
.chip-btn:hover{border-color:var(--brand);color:var(--brand)}
.chip-btn.alt{border-style:dashed;color:var(--muted)}

/* ---------- thermal slip ---------- */
.slip-col{position:sticky;top:84px;min-width:0}
@media (max-width:900px){.slip-col{position:static}}
.slip{--tear:9px;position:relative;background:var(--slip);color:var(--slip-ink);font-family:var(--mono);font-size:13px;line-height:1.5;padding:22px 22px 28px;border-radius:6px 6px 0 0;box-shadow:0 18px 34px -22px rgba(0,0,0,.45);min-height:400px;display:flex;flex-direction:column;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--tear)) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(var(--tear)*2) var(--tear) repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--tear)) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(var(--tear)*2) var(--tear) repeat-x}
.s-store{text-align:center;display:flex;flex-direction:column;padding-bottom:10px;border-bottom:1px dashed var(--slip-rule)}
.s-store b{font-family:var(--display);font-size:16px}
.s-store span{font-size:11px;color:var(--slip-muted)}
.s-title{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.2em;font-weight:600;margin:12px 0 6px;color:var(--slip-muted)}
.s-title b{color:var(--slip-ink)}
.s-kv{display:flex;justify-content:space-between;gap:10px}
.s-kv span{color:var(--slip-muted)}
.s-rule{border:0;border-top:1px dashed var(--slip-rule);margin:10px 0;width:100%}
.s-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--slip-muted);padding:30px 0}
.s-empty svg{width:46px;height:46px;stroke:var(--slip-rule);stroke-width:1.5}
.s-empty .big{font-family:var(--display);font-size:22px;color:var(--slip-ink)}
.s-today{display:flex;gap:18px;margin-top:6px}
.s-today div{display:flex;flex-direction:column;align-items:center}
.s-today b{font-family:var(--display);font-size:20px;color:var(--slip-ink)}
.s-today span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.s-patient{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:10px;margin:4px 0}
.s-patient input{border:0;border-bottom:1px solid var(--slip-rule);background:transparent;color:var(--slip-ink);font-family:var(--display);font-size:20px;font-weight:700;padding:2px 0;border-radius:0;min-width:0}
.s-patient input::placeholder{color:var(--slip-rule)}
.s-patient input:focus{outline:none;border-bottom-color:var(--slip-ink)}
.s-patient .age{text-align:right}
.s-items{display:flex;flex-direction:column}
.s-item{padding:9px 0;border-bottom:1px dotted var(--slip-rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline}
.s-item:last-child{border-bottom:0}
.s-name{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.s-amt{text-align:right;font-weight:600}
.s-meta{grid-column:1/-1;font-size:11px;color:var(--slip-muted)}
.s-qty{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--slip-muted)}
.step{display:inline-flex;align-items:center;border:1px solid var(--slip-rule);border-radius:6px;overflow:hidden}
.step button{border:0;background:transparent;color:var(--slip-ink);width:26px;height:26px;cursor:pointer;font-family:var(--mono);font-size:15px}
.step button:hover{background:rgba(0,0,0,.05)}
.step input{width:38px;border:0;border-inline:1px solid var(--slip-rule);background:transparent;color:var(--slip-ink);font-family:var(--mono);text-align:center;height:26px;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.s-qty select{border:1px solid var(--slip-rule);border-radius:6px;background:transparent;color:var(--slip-ink);font-family:var(--mono);font-size:12px;height:28px;padding:0 4px}
.s-x{margin-left:auto;border:0;background:transparent;color:var(--slip-muted);cursor:pointer;width:26px;height:26px;border-radius:6px;display:grid;place-items:center}
.s-x:hover{color:var(--bad);background:rgba(0,0,0,.05)}
.s-x svg{width:15px;height:15px}
.flag{display:inline-block;font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:0 5px;line-height:16px}
.flag.rx{background:var(--rx);color:#fff} .flag.warn{background:var(--warn);color:#fff} .flag.bad{background:var(--bad);color:#fff} .flag.ok{background:var(--ok);color:#fff}
.s-fix{grid-column:1/-1;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--body);font-size:12.5px;color:var(--bad);font-weight:700}
.s-fix.warn{color:var(--warn)}
.s-fix button{border:1px solid currentColor;background:transparent;color:var(--brand);border-color:var(--brand);border-radius:999px;padding:2px 10px;font-weight:700;cursor:pointer;font-size:12px}
.s-add select{width:100%;border:1px dashed var(--slip-rule);background:transparent;color:var(--slip-muted);font-family:var(--mono);font-size:12px;padding:7px;border-radius:6px;margin-top:6px}
.s-total{position:relative;display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.12em;color:var(--slip-muted)}
.s-total b{font-size:28px;font-family:var(--display);letter-spacing:-.01em;color:var(--slip-ink)}
.s-pay{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.s-pay button{border:1px solid var(--slip-rule);background:transparent;color:var(--slip-ink);font-family:var(--mono);font-size:12px;padding:6px;border-radius:6px;cursor:pointer}
.s-pay button[aria-pressed="true"]{background:var(--slip-ink);color:var(--slip);border-color:var(--slip-ink)}
.s-actions{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:14px;font-family:var(--body)}
.s-go{border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.s-go:hover{background:var(--brand-2)}
.s-go[disabled]{opacity:.35;cursor:not-allowed}
.s-go kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.7;font-weight:400}
.s-sec{display:flex;gap:6px}
.s-sec button{flex:1;border:1px solid var(--slip-rule);border-radius:12px;background:transparent;color:var(--slip-ink);font-weight:600;padding:10px;cursor:pointer;font-size:14px}
.s-say{text-align:center;font-size:12px;color:var(--slip-muted);margin:2px 0 0}
.s-stamp{position:absolute;left:30%;top:0;transform:rotate(-9deg);border:3px solid var(--ok);color:var(--ok);font-family:var(--display);font-weight:700;letter-spacing:.14em;padding:0 10px;border-radius:6px;font-size:20px;opacity:.85;pointer-events:none}
.s-note{font-size:10.5px;color:var(--slip-muted);margin:8px 0 0}
.s-speed{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--body);font-size:13px;margin-top:12px;padding:8px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.s-speed b{font-family:var(--display);font-size:18px}
.s-card{border:1px solid var(--slip-rule);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px;margin-top:8px}
.s-card .qty{font-family:var(--display);font-size:26px;font-weight:700}

/* ---------- pages ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap}
#invSort{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--surface)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button.red[aria-pressed="false"]{color:var(--bad)}
.exp-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exp-sum{font-size:13.5px;color:var(--muted);margin-left:auto}
.exp-sum b{color:var(--ink)}
.days{display:block;font-size:12px;font-weight:700;font-family:var(--body)}
.days.bad{color:var(--bad)} .days.warn{color:var(--warn)} .days.ok{color:var(--muted);font-weight:600}
tr.expired td{background:var(--bad-soft)}
tr.expired td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font-size:12px;font-weight:700;color:var(--muted)}
tr.top .rank{background:var(--brand);color:var(--brand-ink)}
tr.top td b{color:var(--brand)}
.share{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:5px;max-width:160px}
.share i{display:block;height:100%;background:var(--brand);border-radius:3px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#invSearch{border:1px solid var(--line);border-radius:12px;padding:9px 14px;background:var(--surface);width:260px;max-width:100%}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:0}
.stat b{font-family:var(--display);font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.rx b{color:var(--rx)}
.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
table.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td small{display:block;color:var(--muted);font-size:12.5px}
table.t .num{text-align:right;white-space:nowrap}
table.t tbody tr.sel td{background:var(--brand-soft)}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--sunk)}
tr.flash td{animation:flash 1.8s ease-out}
@keyframes flash{0%{background:var(--brand-soft)}100%{background:transparent}}
.lvl{display:flex;align-items:center;gap:10px}
.gauge{width:72px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;flex:none}
.gauge i{display:block;height:100%;background:var(--ok);border-radius:3px}
.gauge i.low{background:var(--warn)} .gauge i.out{background:var(--bad)}
.tag{display:inline-flex;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--sunk);color:var(--muted);white-space:nowrap;vertical-align:1px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.low,.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.out,.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.rx{background:var(--rx-soft);color:var(--rx)}
@media (max-width:640px){.hide-s{display:none}#stockBody .gauge{display:none}}
.empty{color:var(--muted);padding:28px 4px;margin:0;text-align:center}
.bills-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:24px;align-items:start}
@media (max-width:900px){.bills-grid{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi.hero{background:var(--station);border-color:var(--station);color:var(--station-ink)}
.kpi.hero span{color:var(--station-muted)}
.ins-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.ins-grid{grid-template-columns:minmax(0,1fr)}}
#timeChart svg{width:100%;height:auto;display:block;stroke:none}
.log{list-style:none;margin:0;padding:0;max-height:480px;overflow:auto}
.log li{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:70px minmax(0,1fr);gap:2px 10px}
.log li:last-child{border-bottom:0}
.log .t{white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.log .txt{overflow-wrap:anywhere}
.log .out{grid-column:2;font-size:12.5px;color:var(--muted)}

/* ---------- footer, modal, toast ---------- */
.foot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;width:100%;margin:0 auto}
.dot{display:inline-flex;align-items:center;gap:7px}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.cloud::before{background:var(--ok)}
.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.modal{position:fixed;inset:0;background:rgba(6,18,14,.55);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet p{margin:0}
.note{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13.5px}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-family:var(--mono);background:var(--sunk)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--brand);margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;width:max-content;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff} .toast.ok{background:var(--ok);color:#fff}
@media (max-width:820px){.s-go kbd{display:none}.toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}}
#printArea{display:none}
@media print{
  body{background:#fff;padding:0}
  body > *:not(#printArea){display:none!important}
  body::before{display:none}
  #printArea{display:block;width:76mm;margin:0 auto}
  #printArea .slip{box-shadow:none;-webkit-mask:none;mask:none;padding:0;background:#fff;min-height:0}
  @page{margin:6mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- voice agent ---------- */
.agent-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:var(--station-ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;margin-top:auto}
.agent-btn:hover{background:rgba(255,255,255,.12)}
.ag-dot{width:9px;height:9px;border-radius:50%;background:var(--station-muted)}
body.agent .agent-btn{background:var(--signal);border-color:var(--signal);color:#fff}
body.agent .ag-dot{background:#fff;animation:pulse 1.2s ease-in-out infinite}
body.agent #mic{background:var(--signal);color:#fff}
@keyframes pulse{50%{opacity:.35}}
.live .who{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--station-muted);font-weight:700;margin-bottom:2px}
.agent-set{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.agent-set summary{cursor:pointer;font-weight:700;font-size:13.5px}
.agent-set[open]{display:flex;flex-direction:column;gap:10px}
.agent-set input{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-family:var(--mono);background:var(--sunk);font-weight:400;min-width:0}
.agent-set .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--brand)"/><path d="M16 9h8v7h7v8h-7v7h-8v-7H9v-8h7z" fill="var(--brand-ink)"/><circle cx="31" cy="31" r="6" fill="var(--signal)" stroke="var(--brand)" stroke-width="2"/></svg>
    <div class="brand-t"><b>Pharma.com</b><span>Shree Sai Medicals</span></div>
  </div>
  <nav class="nav" aria-label="Sections">
    <a href="#counter" data-view="counter"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Counter</span></a>
    <a href="#stock" data-view="stock"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/></svg><span>Stock</span><i id="navAlert" hidden></i></a>
    <a href="#bills" data-view="bills"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3zM9 8h6M9 12h6"/></svg><span>Bills</span></a>
    <a href="#insights" data-view="insights"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Dashboard</span></a>
  </nav>
  <div class="bar-r">
    <button type="button" id="engine" class="pill" title="Speech engine"><span id="engineTxt">…</span></button>
    <button type="button" id="openSet" class="icon" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </div>
</header>

<main id="main">
  <section class="view" id="v-counter" aria-label="Counter">
    <div class="counter">
      <div class="voice-col">
        <div class="station">
          <div id="langs" class="langs" role="group" aria-label="Language"></div>
          <button type="button" id="mic" aria-label="Tap to speak"><span class="ring"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg></button>
          <div class="wave" id="wave" aria-hidden="true"></div>
          <p id="micState" class="mic-state">Tap to speak</p>
          <div id="live" class="live" aria-live="polite"></div>
          <button type="button" id="agentBtn" class="agent-btn" hidden><span class="ag-dot"></span><span id="agentTxt">Talk to agent</span></button>
        </div>
        <form id="typeForm" class="type">
          <label for="cmd" class="sr">Type a command</label>
          <input id="cmd" autocomplete="off" placeholder="Type a command">
          <button type="submit" aria-label="Run"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </form>
        <div class="demo"><span class="eyebrow">Demo</span><div id="examples" class="chips"></div></div>
      </div>
      <div class="slip-col"><div id="slip" class="slip" aria-live="polite"></div></div>
    </div>
  </section>

  <section class="view" id="v-stock" aria-label="Stock" hidden>
    <div class="page-head">
      <h1>Stock</h1>
      <div class="tools">
        <input id="invSearch" type="search" placeholder="Search" autocomplete="off" aria-label="Search stock">
        <select id="invSort" aria-label="Sort"><option value="expiry">Expiry first</option><option value="value">Stock value</option><option value="rack">Rack</option><option value="name">Name</option></select>
      </div>
    </div>
    <div id="stockStats" class="stats" role="group" aria-label="Filter by stock level"></div>
    <div class="exp-bar"><span class="eyebrow">Expires within</span><div id="expWin" class="seg" role="group" aria-label="Expiry window"></div><span id="expSum" class="exp-sum"></span></div>
    <div id="stockBody" class="panel"></div>
  </section>

  <section class="view" id="v-bills" aria-label="Bills" hidden>
    <div class="page-head"><h1>Bills</h1><span id="billsSub" class="sub"></span></div>
    <div class="bills-grid"><div id="billsBody" class="panel"></div><div class="slip-col"><div id="billSlip" class="slip"></div></div></div>
  </section>

  <section class="view" id="v-insights" aria-label="Insights" hidden>
    <div class="page-head"><h1>Dashboard</h1><div id="period" class="seg" role="group" aria-label="Period"></div></div>
    <div id="kpis" class="kpis"></div>
    <div class="ins-grid">
      <div class="panel"><div class="row-between"><h2>Top sellers</h2><span class="sub" id="topSub"></span></div><div id="topBody"></div></div>
      <div class="panel"><div class="row-between"><h2>Sell first</h2><span class="sub" id="riskSub"></span></div><div id="riskBody"></div></div>
      <div class="panel"><h2>Seconds per bill · today</h2><div id="timeChart"></div></div>
      <div class="panel"><h2>Voice log</h2><div id="logBody"></div></div>
    </div>
  </section>
</main>

<footer class="foot"><span id="dataMode" class="dot"></span><button type="button" class="link" id="resetData">Reset demo</button></footer>

<div class="modal" id="setModal" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet">
    <div class="row-between"><h2 id="setTitle">Settings</h2><button type="button" class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p id="voiceNote" class="note" hidden></p>
    <label class="field" for="setKey">Sarvam API key
      <span class="keyrow"><input id="setKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk_…"><button type="button" class="btn sm" id="setShow">Show</button></span>
    </label>
    <p id="keyStatus" class="sub"></p>
    <details class="agent-set" id="agentSet">
      <summary>Voice agent (Samvaad)</summary>
      <label class="field" for="agKey">Agent API key<input id="agKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk_samvaad_…"></label>
      <label class="field" for="agApp">Agent ID<input id="agApp" autocomplete="off" spellcheck="false" placeholder="App / agent ID"></label>
      <div class="two"><label class="field" for="agOrg">Org ID<input id="agOrg" autocomplete="off" spellcheck="false"></label><label class="field" for="agWs">Workspace ID<input id="agWs" autocomplete="off" spellcheck="false"></label></div>
      <p class="sub" id="agStatus"></p>
    </details>
    <label class="check"><input type="checkbox" id="setVoice"><span>Use Sarvam for speech</span></label>
    <label class="check"><input type="checkbox" id="setSpeak"><span>Speak replies</span></label>
    <label class="check"><input type="checkbox" id="setPrint"><span>Print on confirm</span></label>
    <div class="row-between"><button type="button" class="btn" id="setTest">Test key</button><button type="button" class="btn primary" id="setSave">Save</button></div>
  </div>
</div>

<div id="printArea"></div>
<div id="toast" class="toast" role="status"></div>

    if(MATRA[off]){ out+=MATRA[off]; continue; }
  }
  return out;
}

/* ---------- Normalisers ---------- */
function lnorm(w){
  return w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/aa+/g,'a').replace(/ii+|ee+/g,'i').replace(/uu+|oo+/g,'u');
}
function mnorm(w){
  let s=lnorm(w);
  s=s.replace(/ph/g,'f').replace(/z/g,'j').replace(/x/g,'ks').replace(/q/g,'k').replace(/w/g,'v')
     .replace(/c(?=[eiy])/g,'s').replace(/ch/g,'c').replace(/c/g,'k')
     .replace(/([kgtdbjsp])h/g,'$1').replace(/y/g,'i').replace(/ai/g,'a').replace(/(.)\1+/g,'$1');
  return s;
}
function displayName(raw){
  return raw.split(/\s+/).filter(Boolean).map(w=>{
    if(/[A-Z]/.test(w)) return w;            // keep typed casing
    w=w.replace(/ii/g,'ee').replace(/uu/g,'oo').replace(/aa/g,'a');
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(' ');
}

/* ---------- Tokeniser ---------- */
function tokenize(text){
  let t = translit(text);
  t = t.replace(/(\d),(\d)/g,'$1$2')
       .replace(/([A-Za-z])(\d)/g,'$1 $2').replace(/(\d)([A-Za-z])/g,'$1 $2')
       .replace(/[^A-Za-z0-9\s]/g,' ');
  return t.split(/\s+/).filter(Boolean).map((raw,i)=>({i, raw, w:lnorm(raw), m:mnorm(raw), kind:null}));
}

/* ---------- Levenshtein ---------- */
function lev(a,b){
  if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}

/* ---------- Medicine alias index ---------- */
function buildIndex(inv){
  const idx=[]; const firstWordCount={};
  const meds=Object.values(inv);
  meds.forEach(m=>{ const fw=mnorm(tokenize(m.name)[0].raw); firstWordCount[fw]=(firstWordCount[fw]||0)+1; });
  meds.forEach(m=>{
    const names=new Set([m.name, ...(m.aliases||[])]);
    const fwTok=tokenize(m.name)[0];
    if(firstWordCount[fwTok.m]===1 && fwTok.m.length>=4 && !/\d/.test(fwTok.raw)) names.add(fwTok.raw);
    names.forEach(n=>{
      const toks=tokenize(n);
      const joined=toks.map(t=>t.m).join('');
      const digits=toks.filter(t=>/^\d+$/.test(t.raw)).map(t=>t.raw).join('|');
      if(joined.length>=3) idx.push({id:m.id, n:toks.length, joined, digits});
    });
  });
  return idx;
}

function matchMeds(tokens, index){
  const cands=[];
  for(let s=0;s<tokens.length;s++){
    for(let L=1;L<=4 && s+L<=tokens.length;L++){
      const win=tokens.slice(s,s+L);
      if(win.every(t=>/^\d+$/.test(t.raw) || NUMW[t.w]!==undefined)) continue;
      if(STOP.has(win[0].w) && win[0].w.length<=4) continue;
      const joined=win.map(t=>t.m).join('');
      const digits=win.filter(t=>/^\d+$/.test(t.raw)).map(t=>t.raw).join('|');
      for(const a of index){
        if(Math.abs(a.n-L)>1) continue;
        if(a.digits && digits && a.digits!==digits) continue;
        if(!a.digits && digits) continue;
        const d=lev(joined,a.joined); const score=1-d/Math.max(joined.length,a.joined.length);
        const min = a.joined.length<=4 ? 0.8 : 0.74;
        if(score>=min) cands.push({id:a.id,s,e:s+L,score,len:a.joined.length});
      }
    }
  }
  cands.sort((x,y)=> y.score-x.score || y.len-x.len || (y.e-y.s)-(x.e-x.s));
  const taken=new Array(tokens.length).fill(false); const used=new Set(); const out=[];
  for(const c of cands){
    if(used.has(c.id)) continue;
    let free=true; for(let k=c.s;k<c.e;k++) if(taken[k]) free=false;
    if(!free) continue;
    for(let k=c.s;k<c.e;k++){ taken[k]=true; tokens[k].kind='med'; }
    used.add(c.id); out.push(c);
  }
  return out.sort((a,b)=>a.s-b.s);
}

/* ---------- Numbers ---------- */
function findNumbers(tokens){
  const groups=[];
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i]; if(t.kind) continue;
    if(/^\d+$/.test(t.raw)){ t.kind='num'; groups.push({s:i,e:i+1,val:parseInt(t.raw,10)}); continue; }
    const v=NUMW[t.w]; if(v===undefined) continue;
    if(AMBIG_NUM.has(t.w)){
      const nx=tokens[i+1]; const ok = nx && (UNIT_PACK.has(nx.w)||UNIT_UNIT.has(nx.w)||AGE_AFTER.has(nx.w));
      if(!ok) continue;
    }
    let cur=v, j=i+1;
    while(j<tokens.length && !tokens[j].kind){
      const nv=NUMW[tokens[j].w]; if(nv===undefined) break;
      if(HUNDRED.has(tokens[j].w)){ cur=(cur||1)*100; j++; continue; }
      if(cur>=100 && cur%100===0 && nv<100){ cur+=nv; j++; continue; }
      if(cur>=20 && cur<100 && cur%10===0 && nv>0 && nv<10){ cur+=nv; j++; continue; }
      break;
    }
    for(let k=i;k<j;k++) tokens[k].kind='num';
    groups.push({s:i,e:j,val:cur});
    i=j-1;
  }
  groups.forEach(g=>{
    const nx=tokens[g.e], pv=tokens[g.s-1];
    const nx2=tokens[g.e+1];
    if(nx && UNIT_PACK.has(nx.w)){ g.unit='pack'; nx.kind='unit'; }
    else if(nx && UNIT_UNIT.has(nx.w)){ g.unit='unit'; nx.kind='unit'; }
    else if(nx && ['ki','ke','ka','chi','che','cha'].includes(nx.w) && nx2 && (UNIT_PACK.has(nx2.w)||UNIT_UNIT.has(nx2.w))){ g.unit=UNIT_PACK.has(nx2.w)?'pack':'unit'; nx2.kind='unit'; }
    if(nx && AGE_AFTER.has(nx.w) && !g.unit){ g.age=true; nx.kind='ageword'; }
    if(pv && AGE_BEFORE.has(pv.w) && pv.kind!=='med' && !g.unit){ g.age=true; pv.kind='ageword'; }
  });
  return groups;
}

/* ---------- Main parse ---------- */
function parseCommand(text, inv, index, opts={}){
  const script=scriptOf(text);
  const tokens=tokenize(text);
  const res={text, script, tokens, intent:'unknown', items:[], patient:{name:'',age:null}, notes:[]};
  if(!tokens.length) return res;
  const ws=new Set(tokens.map(t=>t.w));

  if(opts.pending && tokens.length<=5){
    const yes=tokens.some(t=>YES_W.has(t.w)), no=tokens.some(t=>NO_W.has(t.w));
    if(no && !yes){ res.intent='cancel'; return res; }
    if(yes){ res.intent='confirm'; return res; }
  }

  const meds=matchMeds(tokens,index);
  const nums=findNumbers(tokens);

  let ageGroup=nums.find(g=>g.age && g.val>0 && g.val<=120);
  const strong=nums.filter(g=>!g.age && g.unit);
  const weak=nums.filter(g=>!g.age && !g.unit);

  const takenQ=new Set();
  const qty={};
  if(meds.length && strong.length===meds.length){
    meds.forEach((m,k)=>{ qty[m.id]=strong[k]; takenQ.add(strong[k]); });
  } else {
    const assign=(pool)=>meds.forEach(m=>{
      if(qty[m.id]) return;
      let best=null,bd=1e9;
      pool.forEach(g=>{ if(takenQ.has(g)) return;
        const d = g.s>=m.e ? g.s-m.e : (m.s-g.e)+0.5;
        if(d<bd){bd=d;best=g;} });
      if(best && bd<=6){ qty[m.id]=best; takenQ.add(best); }
    });
    assign(strong); assign(weak);
  }
  if(!ageGroup){
    const left=weak.filter(g=>!takenQ.has(g) && g.val>0 && g.val<=110);
    if(left.length){ ageGroup=left[0]; }
  }
  if(ageGroup){ res.patient.age=ageGroup.val; for(let k=ageGroup.s;k<ageGroup.e;k++) tokens[k].kind='num'; }

  res.items=meds.map(m=>{
    const g=qty[m.id];
    return {id:m.id, qty:g?g.val:1, unit:g&&g.unit?g.unit:'pack', assumedQty:!g, heard:tokens.slice(m.s,m.e).map(t=>t.raw).join(' ')};
  });

  // Intent
  const hasAdd=tokens.some(t=>ADD_W.has(t.w) && t.kind!=='med');
  const hasStock=tokens.some(t=>STOCK_W.has(t.w) && t.kind!=='med') || (ws.has('hai')&&ws.has('kya')) || (ws.has('ahe')&&ws.has('ka'));
  const hasBill=tokens.some(t=>BILL_W.has(t.w) && t.kind!=='med');

  // Patient name
  const isCand=t=>!t.kind && !STOP.has(t.w) && /^[a-z]+$/i.test(t.raw) && t.raw.length>=2 && NUMW[t.w]===undefined && !UNIT_PACK.has(t.w) && !UNIT_UNIT.has(t.w) && !AGE_AFTER.has(t.w) && !YES_W.has(t.w);
  let nameToks=null;
  for(let i=0;i<tokens.length && !nameToks;i++){
    const t=tokens[i]; if(t.kind) continue;
    if(MARK_BEFORE.has(t.w) && tokens[i+1] && isCand(tokens[i+1])){
      nameToks=[tokens[i+1]]; if(tokens[i+2]&&isCand(tokens[i+2])) nameToks.push(tokens[i+2]);
    } else if(MARK_AFTER.has(t.w) && i>0){
      let k=i-1; if(tokens[k] && tokens[k].w==='ke') k--;
      const arr=[]; while(k>=0 && isCand(tokens[k]) && arr.length<2){ arr.unshift(tokens[k]); k--; }
      if(arr.length) nameToks=arr;
    }
  }
  if(!nameToks){
    const first=tokens.findIndex(isCand);
    if(first>=0){ nameToks=[tokens[first]]; if(tokens[first+1]&&isCand(tokens[first+1])) nameToks.push(tokens[first+1]); }
  }
  if(nameToks){
    let raw=nameToks.map(t=>t.raw).join(' ');
    const sfx = script==='knda' ? /(avarige|ge)$/i : script==='telu' ? /(gariki|kosam|ki|ku)$/i : /(sathi|saathi)$/i;
    const parts=raw.split(' '); const last=parts.pop(); const stripped=last.replace(sfx,'');
    raw=[...parts, stripped.length>=3?stripped:last].join(' ');
    res.patient.name=displayName(raw);
  }

  if(meds.length){
    if(hasAdd) res.intent='restock';
    else if(hasStock && !hasBill && !res.patient.age) { res.intent='stock'; res.patient.name=''; }
    else res.intent='bill';
  }
  if(res.intent==='stock' || res.intent==='restock'){ res.patient={name:'',age:null}; }
  return res;
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function load(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function toast(msg,kind=''){ const t=$('#toast'); t.textContent=msg; t.className='toast show '+kind; clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',3000); }
const today=()=>new Date().toDateString();
const timeStr=ts=>new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});

/* ---------- settings ---------- */
let SET=Object.assign({key:'',lang:'auto',useVoice:true,speak:true,autoPrint:false,keyState:'',agent:{key:'',app:'',org:'',ws:''}},load(LS_SET)||{});
if(!SET.agent) SET.agent={key:'',app:'',org:'',ws:''};
const saveSet=()=>store(LS_SET,SET);

/* ---------- data layer: cloud db when available, else this browser ---------- */
const Data={inv:{},bills:[],log:[],cloud:false,db:null,readOnly:false};
let INDEX=[], KEYTERMS=[];
function reindex(){ INDEX=buildIndex(Data.inv); KEYTERMS=Object.values(Data.inv).map(m=>m.name).concat(['strip','tablet','bottle','tube','sachet']); }
function loadLocal(){
  const s=load(LS_DB);
  if(s&&s.inv&&Object.keys(s.inv).length){ Data.inv=s.inv; Data.bills=s.bills||[]; Data.log=s.log||[]; }
  else { Data.inv=seedInventory(); Data.bills=sampleBills(Data.inv); Data.log=[]; }
  reindex();
}
function saveLocal(){ if(!Data.cloud) store(LS_DB,{inv:Data.inv,bills:Data.bills,log:Data.log}); }
let writeErrShown=false;
function cloudErr(e){
  if(e&&(e.code==='not_granted'||e.code==='revoked')) Data.readOnly=true;
  if(!writeErrShown){ writeErrShown=true; toast(Data.readOnly?'View-only access. Ask the owner to edit.':'Not saved. Check the connection.','bad'); }
}
async function cloudInit(){
  if(!window.claude||!window.claude.use) return;
  let db=null; try{ db=await window.claude.use('db'); }catch(e){}
  if(!db) return;
  Data.db=db;
  const timer=setTimeout(()=>{ if(!Data.cloud) renderFoot(); },10000);
  db.collection('inventory').onSnapshot(snap=>{
    clearTimeout(timer);
    if(snap.empty){ renderFoot('Store database is empty. Showing demo stock on this device.'); return; }
    const inv={}; snap.docs.forEach(d=>{ const v=d.data(); if(v) inv[d.id]=Object.assign({id:d.id},v); });
    Data.inv=inv; Data.cloud=true; reindex(); renderAll();
  },()=>{ clearTimeout(timer); renderFoot(); });
  db.collection('bills').orderBy('at','desc').limit(150).onSnapshot(snap=>{
    if(!Data.cloud && snap.empty) return;
    Data.bills=snap.docs.map(d=>Object.assign({_id:d.id},d.data())); renderAll();
  },()=>{});
  db.collection('log').orderBy('at','desc').limit(150).onSnapshot(snap=>{
    if(!Data.cloud && snap.empty) return;
    Data.log=snap.docs.map(d=>Object.assign({_id:d.id},d.data())); if(view==='insights') renderInsights();
  },()=>{});
}
function persistStock(ids){
  if(Data.cloud&&Data.db){ ids.forEach(id=>Data.db.doc('inventory/'+id).update({stock:Data.inv[id].stock}).catch(cloudErr)); }
  else saveLocal();
}
function persistBill(b){
  Data.bills.unshift(b);
  if(Data.cloud&&Data.db){ Data.db.doc('bills/'+b.id).set(b).catch(cloudErr); } else saveLocal();
}
function logEvent(text,meta,intent,outcome){
  const e={id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:Date.now(),text,engine:meta.engine||'Typed',lang:meta.lang||'',secs:meta.latency!=null?+meta.latency.toFixed(1):null,intent,outcome};
  Data.log.unshift(e); Data.log=Data.log.slice(0,150);
  if(Data.cloud&&Data.db){ Data.db.doc('log/'+e.id).set(e).catch(()=>{}); } else saveLocal();
  if(view==='insights') renderInsights();
}

/* ---------- medicine helpers ---------- */
function stockText(m,units=m.stock){
  if(m.pack===1) return plural(units,m.packName);
  const p=Math.floor(units/m.pack), r=units%m.pack;
  return plural(p,m.packName)+(r?` + ${r} ${m.unitName}`:'');
}
const unitLabel=(m,unit,qty)=> unit==='pack'||m.pack===1 ? plural(qty,m.packName) : plural(qty,m.unitName);
const needUnits=(m,it)=> it.unit==='pack'||m.pack===1 ? it.qty*m.pack : it.qty;
const lineAmt=(m,it)=> it.unit==='pack'||m.pack===1 ? it.qty*m.mrp : it.qty*m.mrp/m.pack;
function status(m){ if(m.stock<=0) return ['out','Out of stock']; if(m.stock<=m.reorder) return ['low','Reorder']; return ['ok','In stock']; }
function expiryDate(exp){ const [y,mo]=exp.split('-').map(Number); return new Date(y,mo,0,23,59,59); } // last day of expiry month
const daysLeft=exp=>Math.floor((expiryDate(exp)-Date.now())/864e5);
const monthsLeft=exp=>daysLeft(exp)/30;
function expInfo(exp){ const d=daysLeft(exp); if(d<0) return {d,cls:'bad',txt:'Expired'}; if(d<=30) return {d,cls:'bad',txt:`${d} days left`}; if(d<=90) return {d,cls:'warn',txt:`${d} days left`}; return {d,cls:'ok',txt:d<=365?`${Math.round(d/30)} months`:'> 1 year'}; }
const isExpired=m=>daysLeft(m.expiry)<0;
const stockValue=m=>m.stock*m.mrp/m.pack;
const expLabel=exp=>{ const [y,m]=exp.split('-'); return `${m}/${y.slice(2)}`; };
const substitutes=(m,units)=>Object.values(Data.inv).filter(x=>x.id!==m.id&&x.generic===m.generic&&x.stock>=Math.max(units,1)&&!isExpired(x)).sort((a,b)=>daysLeft(a.expiry)-daysLeft(b.expiry));
function itemIssue(it){ const m=Data.inv[it.id]; if(!m) return {k:'gone'}; const need=needUnits(m,it); if(m.stock<=0) return {k:'out',subs:substitutes(m,need)}; if(isExpired(m)) return {k:'expired',subs:substitutes(m,need)}; if(need>m.stock) return {k:'short'}; return null; }
function billNo(){ const d=new Date(); const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1; const p=n=>String(n).padStart(2,'0');
  return `SSM/${String(y).slice(2)}-${String(y+1).slice(2)}/${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function speak(text){
  if(!SET.speak||AG||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-IN'; u.rate=1.03;
    const v=speechSynthesis.getVoices().find(v=>v.lang==='en-IN'); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){}
}

/* ---------- view routing ---------- */
const VIEWS=['counter','stock','bills','insights'];
let view='counter';
function setView(v){
  if(!VIEWS.includes(v)) v='counter'; view=v;
  VIEWS.forEach(x=>{ $('#v-'+x).hidden=x!==v; });
  document.querySelectorAll('.nav a').forEach(a=>{ if(a.dataset.view===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });

}
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));

/* ---------- slip (the hero) ---------- */
let slip={mode:'idle'};
let lastBill=null;
const slipHeader=()=>`<div class="s-store"><b>${esc(STORE.name)}</b><span>${esc(STORE.addr)}</span></div>`;
const actionSecondary=b=>IN_ARTIFACT?(Downloads?`<button type="button" data-act="save" data-id="${esc(b.id)}">Save</button>`:''):`<button type="button" data-act="print" data-id="${esc(b.id)}">Print</button>`;
function renderSlip(){
  const el=$('#slip');
  if(slip.mode!=='idle'&&slip.mode!==renderSlip.last&&window.innerWidth<900&&view==='counter') setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),30);
  renderSlip.last=slip.mode;
  const m=slip.mode;
  if(m==='idle'){
    const tb=Data.bills.filter(b=>new Date(b.at).toDateString()===today());
    const avg=tb.length?(tb.reduce((a,b)=>a+b.seconds,0)/tb.length).toFixed(1):'—';
    el.innerHTML=`${slipHeader()}<div class="s-empty">${ICON.slip}<span class="big">Next patient</span>
      <div class="s-today"><div><b>${tb.length}</b><span>bills today</span></div><div><b>${avg}${tb.length?' s':''}</b><span>avg / bill</span></div></div></div>`;
    return;
  }
  if(m==='thinking'){ el.innerHTML=`${slipHeader()}<div class="s-empty">${ICON.dots}<span class="big">Matching…</span></div>`; return; }
  if(m==='unknown'){
    el.innerHTML=`${slipHeader()}<div class="s-empty">${ICON.search}<span class="big">No medicine found</span><span>Try the brand name, e.g. “Dolo 650”.</span></div>
      <div class="s-actions"><div class="s-sec"><button type="button" data-act="done">Back</button></div></div>`;
    return;
  }
  if(m==='draft') return renderDraft(el);
  if(m==='restock'){
    el.innerHTML=`${slipHeader()}<div class="s-title"><b>STOCK IN</b></div>
      <div class="s-items">${slip.items.map(it=>{ const md=Data.inv[it.id]; const add=needUnits(md,it);
        return `<div class="s-item"><div class="s-name">${esc(md.name)}</div><div class="s-amt">+${esc(unitLabel(md,it.unit,it.qty))}</div><div class="s-meta">${esc(stockText(md))} → ${esc(stockText(md,md.stock+add))} · ${md.rack}</div></div>`; }).join('')}</div>
      <div class="s-actions"><button type="button" class="s-go" data-act="confirm">Add to stock <kbd>Enter</kbd></button><p class="s-say">or say “haan” · <button type="button" class="link" data-act="cancel">Cancel</button></p></div>`;
    return;
  }
  if(m==='stock'){
    el.innerHTML=`${slipHeader()}<div class="s-title"><b>STOCK</b></div>${slip.items.map(it=>{ const md=Data.inv[it.id]; const [k,l]=status(md); const subs=md.stock<=0?substitutes(md,1):[];
      return `<div class="s-card"><div class="s-name">${esc(md.name)} <span class="flag ${k==='ok'?'ok':k==='low'?'warn':'bad'}">${l.toUpperCase()}</span></div><div class="qty">${esc(stockText(md))}</div>
        <div class="s-meta">Rack ${md.rack} · Exp ${expLabel(md.expiry)} (${expInfo(md.expiry).txt}) · ${money(md.mrp)}/${md.packName}</div>
        ${subs.length?`<div class="s-fix warn">Same salt: ${subs.map(s=>esc(s.name)).join(', ')}</div>`:''}</div>`; }).join('')}
      <div class="s-actions">${slip.items.some(it=>Data.inv[it.id].stock>0)?'<button type="button" class="s-go" data-act="billfromstock">Bill this</button>':''}<div class="s-sec"><button type="button" data-act="done">Done</button></div></div>`;
    return;
  }
  if(m==='done') el.innerHTML=receiptHTML(slip.bill,true);
}
function renderDraft(el){
  const total=slip.items.reduce((a,it)=>a+(Data.inv[it.id]?lineAmt(Data.inv[it.id],it):0),0);
  const blocked=!slip.items.length||slip.items.some(it=>itemIssue(it)||!(it.qty>0));
  const rows=slip.items.map((it,ix)=>{
    const md=Data.inv[it.id]; const iss=itemIssue(it);
    const unitSel=md.pack>1?`<select data-act="unit" data-ix="${ix}" aria-label="Unit"><option value="pack" ${it.unit==='pack'?'selected':''}>${md.packName}</option><option value="unit" ${it.unit==='unit'?'selected':''}>${md.unitName}</option></select>`:`<span>${md.packName}</span>`;
    let fix='';
    if(iss&&iss.k==='out') fix=`<div class="s-fix">Out of stock ${iss.subs.slice(0,2).map(s=>`<button type="button" data-act="swap" data-ix="${ix}" data-to="${s.id}">${esc(s.name)} · same salt</button>`).join('')}</div>`;
    if(iss&&iss.k==='expired') fix=`<div class="s-fix">Expired ${expLabel(md.expiry)} · do not sell ${iss.subs.slice(0,2).map(s=>`<button type="button" data-act="swap" data-ix="${ix}" data-to="${s.id}">${esc(s.name)} · same salt</button>`).join('')}</div>`;
    if(iss&&iss.k==='short') fix=`<div class="s-fix warn">Only ${esc(stockText(md))} <button type="button" data-act="useavail" data-ix="${ix}">Use available</button></div>`;
    return `<div class="s-item"><div class="s-name">${esc(md.name)}${md.rx?'<span class="flag rx">Rx</span>':''}${it.assumedQty?'<span class="flag warn">QTY?</span>':''}</div><div class="s-amt">${money(lineAmt(md,it)).slice(1)}</div>
      <div class="s-meta">${esc(md.generic)} · ${md.rack} · Exp ${expLabel(md.expiry)}${(()=>{const e=expInfo(md.expiry); return e.cls!=='ok'&&e.d>=0?` · ${e.txt}`:'';})()}</div>
      <div class="s-qty"><span class="step"><button type="button" data-act="dec" data-ix="${ix}" aria-label="Less">−</button><input type="number" id="q${ix}" min="1" value="${it.qty}" data-act="qty" data-ix="${ix}" aria-label="Quantity"><button type="button" data-act="inc" data-ix="${ix}" aria-label="More">+</button></span>${unitSel}<button type="button" class="s-x" data-act="remove" data-ix="${ix}" aria-label="Remove ${esc(md.name)}">${ICON.x}</button></div>${fix}</div>`;
  }).join('');
  el.innerHTML=`${slipHeader()}<div class="s-title"><b>BILL</b><span>DRAFT</span></div>
    <div class="s-patient"><input id="pName" value="${esc(slip.patient.name)}" placeholder="Patient" autocomplete="off" aria-label="Patient name"><input id="pAge" class="age" type="number" min="0" max="120" value="${slip.patient.age??''}" placeholder="Age" aria-label="Age"></div>
    <hr class="s-rule"><div class="s-items">${rows}</div>
    <div class="s-add"><select id="addMed" aria-label="Add medicine"><option value="">+ Add medicine</option>${Object.values(Data.inv).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
    <hr class="s-rule"><div class="s-total"><span>TOTAL</span><b>${money(total)}</b></div>
    <div class="s-pay" role="group" aria-label="Payment">${['Cash','UPI','Card'].map(p=>`<button type="button" data-act="pay" data-p="${p}" aria-pressed="${slip.payment===p}">${p}</button>`).join('')}</div>
    <div class="s-actions"><button type="button" class="s-go" data-act="confirm" ${blocked?'disabled':''}>Confirm <kbd>Enter</kbd></button>
      <p class="s-say">or say “haan” · <button type="button" class="link" data-act="cancel">Cancel</button></p></div>`;
}
function receiptHTML(b,live){
  const d=new Date(b.at); const rx=b.lines.some(l=>l.rx);
  const actions=live?`<div class="s-speed">Billed in <b>${b.seconds} s</b></div>
    <div class="s-actions"><button type="button" class="s-go" data-act="next">Next patient</button>${actionSecondary(b)?`<div class="s-sec">${actionSecondary(b)}</div>`:''}</div>`:'';
  return `${slipHeader()}<div class="s-title"><b>TAX INVOICE</b><span>${esc(b.payment.toUpperCase())}</span></div>
    <div class="s-kv"><span>No.</span><b>${esc(b.no)}</b></div>
    <div class="s-kv"><span>Date</span><b>${d.toLocaleDateString('en-IN')} ${timeStr(b.at)}</b></div>
    <div class="s-kv"><span>Patient</span><b>${esc(b.patient.name||'Walk-in')}${b.patient.age!=null?`, ${b.patient.age}`:''}</b></div>
    <hr class="s-rule"><div class="s-items">${b.lines.map(l=>`<div class="s-item"><div class="s-name">${esc(l.name)}${l.rx?' ℞':''}</div><div class="s-amt">${l.amount.toFixed(2)}</div><div class="s-meta">${esc(l.qtyLabel)} × ${l.rate.toFixed(2)} · ${esc(l.batch)} · ${expLabel(l.expiry)}</div></div>`).join('')}</div>
    <hr class="s-rule"><div class="s-total"><span class="s-stamp">PAID</span><span>TOTAL</span><b>${money(b.total)}</b></div>
    <p class="s-note">MRP incl. GST · GSTIN ${esc(STORE.gstin)}${rx?' · ℞ dispensed on prescription':''}</p>${actions}`;

/* ---------- command handling ---------- */
let samplePromise=null;
const getSample=()=>{ if(!window.claude||!window.claude.use) return Promise.resolve(null); if(!samplePromise) samplePromise=window.claude.use('sample').catch(()=>null); return samplePromise; };
async function claudeParse(text){
  const s=await getSample(); if(!s) return null;
  const list=Object.values(Data.inv).map(m=>`${m.id} | ${m.name} | ${m.generic} | sold per ${m.packName}${m.pack>1?` of ${m.pack} ${m.unitName}s`:''}`).join('\n');
  const prompt=`You read voice commands spoken at an Indian pharmacy counter (Hindi, English, Marathi, Kannada, Telugu or a mix). Match medicines ONLY to this stock list (id | name | salt | pack):\n${list}\n\nCommand: """${text}"""\n\nReply with JSON only: {"intent":"bill"|"stock"|"restock"|"unknown","patient":{"name":string,"age":number|null},"items":[{"id":string,"qty":number,"unit":"pack"|"unit"}]}. "pack" means strips/bottles/tubes, "unit" means single tablets/capsules. Write the patient's name in Latin letters. If no medicine from the list is mentioned, use intent "unknown" and an empty items list.`;
  try{
    const r=await s.json(prompt,{modelTier:'quick'});
    if(!r||!Array.isArray(r.items)) return null;
    const items=r.items.filter(i=>i&&Data.inv[i.id]).map(i=>({id:i.id,qty:Math.max(1,parseInt(i.qty,10)||1),unit:i.unit==='unit'?'unit':'pack',assumedQty:!i.qty}));
    if(!items.length) return null;
    return {intent:['bill','stock','restock'].includes(r.intent)?r.intent:'bill',items,patient:{name:(r.patient&&r.patient.name)||'',age:r.patient&&Number.isFinite(+r.patient.age)&&r.patient.age!==null?+r.patient.age:null},text};
  }catch(e){ return null; }
}
async function handleCommand(text,meta){
  text=(text||'').trim(); if(!text) return;
  if(view!=='counter') location.hash='counter';
  if(!meta.keepLive) showLive('Heard',text,meta.engine);
  const pending=slip.mode==='draft'||slip.mode==='restock';
  let res=parseCommand(text,Data.inv,INDEX,{pending});
  let via=meta.engine||'Typed';
  if(!meta.agent) setMicState(IN_ARTIFACT?'Type or tap a demo':'Tap to speak');
  if(meta.agent&&res.intent==='unknown'){ logEvent(text,meta,'chat','Agent conversation'); return; }
  if(res.intent==='unknown'){
    const s=await getSample();
    if(s){ slip={mode:'thinking',transcript:text}; renderSlip();
      const c=await claudeParse(text); if(c){ res=c; via+=' · matched by Claude'; } }
  }
  const short=(res.items||[]).map(it=>`${Data.inv[it.id].name} × ${unitLabel(Data.inv[it.id],it.unit,it.qty)}`).join(', ');
  switch(res.intent){
    case 'confirm': if(pending){ logEvent(text,meta,'confirm','Confirmed by voice'); confirmSlip(); } return;
    case 'cancel': if(pending){ slip={mode:'idle'}; renderSlip(); logEvent(text,meta,'cancel','Draft cancelled'); speak('Cancelled.'); } return;
    case 'bill': {
      slip={mode:'draft',patient:res.patient,items:res.items,transcript:text,via,t0:meta.t0||performance.now(),payment:'Cash',engine:meta.engine||'Typed'};
      renderSlip();
      const issues=res.items.map(it=>({m:Data.inv[it.id],i:itemIssue(it)})).filter(x=>x.i);
      let say=`${res.patient.name||'Patient'}. ${res.items.map(it=>`${Data.inv[it.id].name}, ${unitLabel(Data.inv[it.id],it.unit,it.qty)}`).join('. ')}.`;
      if(issues.length) issues.forEach(x=>{ say+= x.i.k==='expired'?` ${x.m.name} is expired.${x.i.subs&&x.i.subs.length?` ${x.i.subs[0].name} has the same salt.`:''}`: x.i.k==='out'?` ${x.m.name} is out of stock.${x.i.subs&&x.i.subs.length?` ${x.i.subs[0].name} has the same salt.`:''}`:` Only ${stockText(x.m)} of ${x.m.name} left.`; });
      else say+=` Total ${Math.round(res.items.reduce((a,it)=>a+lineAmt(Data.inv[it.id],it),0))} rupees. Confirm?`;
      speak(say); logEvent(text,meta,'bill',`Draft: ${short}${issues.length?' (stock issue)':''}`); return; }
    case 'stock':
      slip={mode:'stock',items:res.items,transcript:text,via}; renderSlip();
      speak(res.items.map(it=>{const m=Data.inv[it.id]; return m.stock>0?`${m.name}: ${stockText(m)}, rack ${m.rack}.`:`${m.name} is out of stock.`}).join(' '));
      logEvent(text,meta,'stock',res.items.map(it=>`${Data.inv[it.id].name}: ${stockText(Data.inv[it.id])}`).join('; ')); return;
    case 'restock':
      slip={mode:'restock',items:res.items,transcript:text,via}; renderSlip();
      speak(`Add ${res.items.map(it=>`${unitLabel(Data.inv[it.id],it.unit,it.qty)} of ${Data.inv[it.id].name}`).join(', ')} to stock?`);
      logEvent(text,meta,'restock',`Draft: ${short}`); return;
    default:
      slip={mode:'unknown',transcript:text,via}; renderSlip(); speak('I could not find the medicine. Please say it again.');
      logEvent(text,meta,'unknown','No medicine recognised');
  }
}
function confirmSlip(){
  if(Data.readOnly){ toast('View-only access.','bad'); return; }
  if(slip.mode==='restock'){
    const ids=slip.items.map(it=>{ const m=Data.inv[it.id]; m.stock+=needUnits(m,it); flash.add(m.id); return m.id; });
    persistStock(ids); toast('Stock updated','ok'); speak('Stock updated.'); slip={mode:'idle'}; renderAll(); return;
  }
  if(slip.mode!=='draft') return;
  const n=$('#pName'); if(n) slip.patient.name=n.value.trim();
  const a=$('#pAge'); if(a) slip.patient.age=a.value?Number(a.value):null;
  if(!slip.items.length||slip.items.some(it=>itemIssue(it)||!(it.qty>0))){ toast('Fix the marked item first.','bad'); return; }
  const lines=slip.items.map(it=>{ const m=Data.inv[it.id]; m.stock-=needUnits(m,it); flash.add(m.id);
    return {id:m.id,name:m.name,generic:m.generic,batch:m.batch,expiry:m.expiry,rx:m.rx,units:needUnits(m,it),qtyLabel:unitLabel(m,it.unit,it.qty),rate:it.unit==='pack'||m.pack===1?m.mrp:m.mrp/m.pack,amount:lineAmt(m,it)}; });
  persistStock(lines.map(l=>l.id));

function encodeWav(chunks,inRate){
  const len=chunks.reduce((a,c)=>a+c.length,0); const data=new Float32Array(len); let o=0; chunks.forEach(c=>{data.set(c,o);o+=c.length;});
  const ratio=inRate/16000; const outLen=Math.min(Math.floor(len/ratio),16000*29);
  const buf=new ArrayBuffer(44+outLen*2); const v=new DataView(buf); const ws=(off,s)=>{for(let i=0;i<s.length;i++) v.setUint8(off+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+outLen*2,true); ws(8,'WAVE'); ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,16000,true); v.setUint32(28,32000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,outLen*2,true);
  for(let i=0;i<outLen;i++){ const s0=Math.floor(i*ratio), s1=Math.min(len,Math.floor((i+1)*ratio)); let sum=0,c=0; for(let k=s0;k<s1;k++){sum+=data[k];c++;} let s=c?sum/c:0; s=Math.max(-1,Math.min(1,s)); v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true); }

const silentWav=()=>encodeWav([new Float32Array(16000)],16000).blob;
function sarvamError(status,body){
  const code=(body&&body.error&&body.error.code)||'';

  if(code==='insufficient_quota_error') return 'Sarvam credits are used up.';
  if(status===429) return 'Sarvam is busy. Try again.';

}
async function sarvamSTT(blob,minimal){

  catch(e){ clearTimeout(to); throw new Error(e.name==='AbortError'?'Sarvam took too long.':'Could not reach Sarvam. Check the internet.'); }
  clearTimeout(to);

  if((r.status===400||r.status===422)&&!minimal) return sarvamSTT(blob,true);
  if(!r.ok){ const err=new Error(sarvamError(r.status,body)); err.status=r.status; err.code=body&&body.error&&body.error.code; throw err; }

}

  if(/Forbidden|403/.test(n+m)) return 'This key cannot open that agent. Check the org and workspace IDs.';
  if(/NotFound|404/.test(n+m)||/no committed version/i.test(m)) return 'Agent not found. Check the agent ID, or commit a version in Samvaad.';
  if(/RateLimit|429/.test(n+m)) return 'Sarvam is busy. Try again in a moment.';
  return 'Could not start the agent'+(m?': '+m.slice(0,90):'.');
}
function renderAgentBtn(){
  const b=$('#agentBtn'); if(!b) return;
  b.hidden=IN_ARTIFACT||!window.SarvamConv;
  $('#agentTxt').textContent=AG?'End agent call':'Talk to agent';
}
async function stopAgent(){
  const ag=AG; if(!ag) return; agentEnding=true; AG=null;
  try{ await ag.stop(); }catch(e){}
  document.body.classList.remove('agent'); setMicState(IN_ARTIFACT?'Type or tap a demo':'Tap to speak'); renderAgentBtn(); agentEnding=false;
}
async function toggleAgent(){
  if(AG) return stopAgent();
  if(!agentReady()){ openSettings(); $('#agentSet').open=true; toast('Add the agent key and IDs first'); return; }
  if(rec) await stopListening();
  const {ConversationAgent,BrowserAudioInterface,InteractionType}=window.SarvamConv;
  const a=SET.agent;
  let ag;
  try{
    ag=new ConversationAgent({
      apiKey:a.key,
      config:{org_id:a.org,workspace_id:a.ws,app_id:a.app,user_identifier:'counter-'+Math.random().toString(36).slice(2,8),user_identifier_type:'custom',interaction_type:InteractionType.CALL,input_sample_rate:16000,output_sample_rate:16000},
      audioInterface:new BrowserAudioInterface(),
      transcriptCallback:async msg=>{
        if(!msg||!msg.content) return;
        const user=msg.role==='user';
        $('#live').innerHTML=`<span class="who">${user?'You':'Agent'}</span>${esc(msg.content)}`;
        if(user) handleCommand(msg.content,{engine:'Samvaad agent',t0:performance.now(),agent:true,keepLive:true});
      },
      stateCallback:async st=>{ if(!AG) return; const L={connecting:'Connecting…',connected:'Agent connected',listening:'Agent listening',speaking:'Agent speaking',error:'Agent error'}; setMicState(L[st]||'Agent'); },
      endCallback:async()=>{ if(AG&&!agentEnding){ AG=null; document.body.classList.remove('agent'); setMicState('Tap to speak'); renderAgentBtn(); toast('Agent call ended'); } },
    });
  }catch(e){ toast(agentError(e),'bad'); return; }
  AG=ag; document.body.classList.add('agent'); renderAgentBtn(); setMicState('Connecting…'); $('#live').innerHTML='';
  try{
    await ag.start();
    const ok=await ag.waitForConnect(12);
    if(!ok) throw new Error('timed out connecting');
    logEvent('Agent call started',{engine:'Samvaad agent'},'agent','Connected');
  }catch(e){ toast(agentError(e),'bad'); await stopAgent(); }
}

/* ---------- settings ---------- */
function keyStatusText(){ return SET.key?(SET.keyState==='ok'?'Key works.':SET.keyState==='bad'?'Key rejected last time.':'Saved. Not tested yet.'):(SERVER_READY?'Using the server key.':'No key. Browser speech is used.'); }
function openSettings(){
  $('#setKey').value=SET.key; $('#setVoice').checked=SET.useVoice; $('#setSpeak').checked=SET.speak; $('#setPrint').checked=SET.autoPrint;
  $('#keyStatus').textContent=keyStatusText();
  const a=SET.agent||{}; $('#agKey').value=a.key||''; $('#agApp').value=a.app||''; $('#agOrg').value=a.org||''; $('#agWs').value=a.ws||''; $('#agStatus').textContent=agentReady()?'Ready. Use “Talk to agent” on the Counter.':'Find the IDs in Samvaad → your agent → Deploy with code.'; $('#agentSet').hidden=IN_ARTIFACT;
  const vn=$('#voiceNote'); vn.hidden=!IN_ARTIFACT; vn.textContent='Shared links can’t use the mic. Open Pharma-com.html in Chrome for voice.';
  $('#setModal').hidden=false; $('#setKey').focus();
}
function saveSettings(){ const k=$('#setKey').value.trim(); if(k!==SET.key) SET.keyState=''; SET.key=k; SET.useVoice=$('#setVoice').checked; SET.speak=$('#setSpeak').checked; SET.autoPrint=$('#setPrint').checked; SET.agent={key:$('#agKey').value.trim(),app:$('#agApp').value.trim(),org:$('#agOrg').value.trim(),ws:$('#agWs').value.trim()}; saveSet(); renderEngine(); renderAgentBtn(); }
async function testKey(){
  saveSettings(); const st=$('#keyStatus');
  if(!SET.key&&!SERVER_READY){ st.textContent='Paste a key first.'; return; }
  st.textContent='Testing…';
  try{ await sarvamSTT(silentWav(),true); if(SET.key) SET.keyState='ok'; st.textContent='Connected to Sarvam.'; }
  catch(e){ if(SET.key&&e.status===403) SET.keyState='bad'; st.textContent=e.message; }
  saveSet(); renderEngine();
}

/* ---------- reset ---------- */
async function resetData(){
  const seed=seedInventory();
  if(Data.cloud&&Data.db){
    try{
      await Promise.all(Object.values(seed).map(m=>Data.db.doc('inventory/'+m.id).set(m)));
      await Promise.all(Data.bills.map(b=>Data.db.doc('bills/'+(b._id||b.id)).delete().catch(()=>{})));
      await Promise.all(Data.log.map(l=>Data.db.doc('log/'+(l._id||l.id)).delete().catch(()=>{})));
      await Promise.all(sampleBills(seed).map(b=>Data.db.doc('bills/'+b.id).set(b)));
    }catch(e){ cloudErr(e); return; }
  }
  Data.inv=seed; Data.bills=sampleBills(seed); Data.log=[]; reindex(); saveLocal(); slip={mode:'idle'}; renderAll(); toast('Reset done','ok');
}

/* ---------- events ---------- */
const billById=id=>Data.bills.find(b=>b.id===id)||lastBill;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act, ix=+el.dataset.ix;
  if(act==='example') handleCommand(el.dataset.text,{engine:'Demo',t0:performance.now()});
  else if(act==='confirm') confirmSlip();
  else if(act==='cancel'){ slip={mode:'idle'}; renderSlip(); }
  else if(act==='done'||act==='next'){ slip={mode:'idle'}; renderSlip(); $('#live').innerHTML=''; }
  else if(act==='remove'){ slip.items.splice(ix,1); if(!slip.items.length) slip={mode:'idle'}; renderSlip(); }
  else if(act==='inc'||act==='dec'){ const it=slip.items[ix]; it.qty=Math.max(1,(it.qty||0)+(act==='inc'?1:-1)); it.assumedQty=false; renderSlip(); }
  else if(act==='swap'){ slip.items[ix].id=el.dataset.to; renderSlip(); }
  else if(act==='useavail'){ const it=slip.items[ix]; const m=Data.inv[it.id]; if(it.unit==='pack'&&m.pack>1&&m.stock%m.pack){ it.unit='unit'; it.qty=m.stock; } else it.qty=it.unit==='pack'||m.pack===1?Math.floor(m.stock/m.pack):m.stock; renderSlip(); }
  else if(act==='pay'){ slip.payment=el.dataset.p; renderSlip(); }
  else if(act==='print') printBill(billById(el.dataset.id));
  else if(act==='save') saveBill(billById(el.dataset.id));
  else if(act==='billfromstock'){ const items=slip.items.filter(it=>Data.inv[it.id].stock>0).map(it=>({id:it.id,qty:1,unit:'pack',assumedQty:true})); slip={mode:'draft',patient:{name:'',age:null},items,transcript:slip.transcript,t0:performance.now(),payment:'Cash',engine:'Typed'}; renderSlip(); }
});
document.addEventListener('change',e=>{
  const el=e.target; if(slip.mode!=='draft') return; const ix=+el.dataset.ix;
  if(el.dataset.act==='qty'){ slip.items[ix].qty=Math.max(1,parseInt(el.value,10)||1); slip.items[ix].assumedQty=false; renderSlip(); }
  else if(el.dataset.act==='unit'){ slip.items[ix].unit=el.value; renderSlip(); }
  else if(el.id==='addMed'&&el.value){ slip.items.push({id:el.value,qty:1,unit:'pack'}); renderSlip(); }
});
document.addEventListener('input',e=>{ if(slip.mode!=='draft') return; if(e.target.id==='pName') slip.patient.name=e.target.value; if(e.target.id==='pAge') slip.patient.age=e.target.value?Number(e.target.value):null; });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!$('#setModal').hidden){ $('#setModal').hidden=true; return; } if(slip.mode==='draft'||slip.mode==='restock'){ slip={mode:'idle'}; renderSlip(); } return; }
  if(view!=='counter'||!$('#setModal').hidden) return;
  const inField=e.target.closest('input,select,textarea,button');
  if(e.key==='Enter'&&(slip.mode==='draft'||slip.mode==='restock')&&(!inField||e.target.closest('.s-patient,.s-qty'))){ e.preventDefault(); confirmSlip(); return; }
  if(inField) return;
  if(e.code==='Space'){ e.preventDefault(); startListening(); }
});
$('#billsBody').addEventListener('click',e=>{ const tr=e.target.closest('[data-bill]'); if(tr){ selBill=tr.dataset.bill; renderBills(); } });
$('#billsBody').addEventListener('keydown',e=>{ const tr=e.target.closest('[data-bill]'); if(tr&&e.key==='Enter'){ selBill=tr.dataset.bill; renderBills(); } });
$('#mic').addEventListener('click',startListening);
$('#agentBtn').addEventListener('click',toggleAgent);
$('#typeForm').addEventListener('submit',e=>{ e.preventDefault(); const v=$('#cmd').value; $('#cmd').value=''; handleCommand(v,{engine:'Typed',t0:performance.now()}); });
$('#langs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; SET.lang=b.dataset.lang; saveSet(); renderEngine(); });
$('#stockStats').addEventListener('click',e=>{ const b=e.target.closest('[data-f]'); if(!b) return; invFilter=(invFilter===b.dataset.f?'all':b.dataset.f); if(invFilter==='exp30') expWin='all'; renderStock(); });
$('#invSearch').addEventListener('input',e=>{ invQuery=e.target.value; renderStock(); });
$('#expWin').addEventListener('click',e=>{ const b=e.target.closest('[data-w]'); if(!b) return; expWin=b.dataset.w==='all'||b.dataset.w==='expired'?b.dataset.w:Number(b.dataset.w); if(invFilter==='exp30') invFilter='all'; renderStock(); });
$('#invSort').addEventListener('change',e=>{ invSort=e.target.value; renderStock(); });
$('#period').addEventListener('click',e=>{ const b=e.target.closest('[data-p]'); if(!b) return; period=b.dataset.p; renderInsights(); });
$('#openSet').addEventListener('click',openSettings);
$('#engine').addEventListener('click',openSettings);
$('#setSave').addEventListener('click',()=>{ saveSettings(); $('#setModal').hidden=true; toast('Saved','ok'); });
$('#setTest').addEventListener('click',testKey);
$('#setShow').addEventListener('click',()=>{ const i=$('#setKey'); i.type=i.type==='password'?'text':'password'; $('#setShow').textContent=i.type==='password'?'Show':'Hide'; });
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{ b.closest('.modal').hidden=true; }));
$('#resetData').addEventListener('click',e=>{ const b=e.currentTarget; if(b.dataset.armed){ delete b.dataset.armed; b.textContent='Reset demo'; resetData(); } else { b.dataset.armed='1'; b.textContent='Tap again to reset'; setTimeout(()=>{ if(b.dataset.armed){ delete b.dataset.armed; b.textContent='Reset demo'; } },4000); } });

/* ---------- boot ---------- */
$('#langs').innerHTML=Object.entries(LANGS).map(([k,v])=>`<button type="button" data-lang="${k}">${v.label}</button>`).join('');
$('#examples').innerHTML=EXAMPLES.map(([l,t,alt])=>`<button type="button" class="chip-btn${alt?' alt':''}" data-act="example" data-text="${esc(t)}" title="${esc(t)}">${esc(l)}</button>`).join('');
$('#wave').innerHTML='<i></i>'.repeat(WAVE_N);
loadLocal(); renderEngine(); renderAgentBtn(); setView(location.hash.slice(1)); renderAll();
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); }catch(e){} }
cloudInit();
if(window.claude&&window.claude.use){ window.claude.use('downloads').then(d=>{ Downloads=d; renderAll(); }).catch(()=>{}); }
if(!IN_ARTIFACT&&location.protocol.startsWith('http')){
  fetch('api/stt').then(r=>r.ok?r.json():null).then(j=>{ SERVER_READY=!!(j&&j.ready); renderEngine(); }).catch(()=>{});
}

</script>
</body></html>
